<script>
function setupDraggableButtons() {
  const buttons = document.querySelectorAll('.btn-wrap');
  
  buttons.forEach((btn) => {
    // 1. 最初はランダムな位置に配置
    const randomX = Math.floor(Math.random() * 70) + 10;
    const randomY = Math.floor(Math.random() * 60) + 10;
    btn.style.left = randomX + '%';
    btn.style.top = randomY + '%';

    // 2. ドラッグ＆ドロップの処理
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    // マウス・タッチが押されたとき
    function startDrag(e) {
      // リンクをクリックしてすぐ飛んでしまわないように、ドラッグ開始時はリンク移動を一旦防ぐ
      isDragging = true;
      
      // イベントの種類（マウスかタッチか）によって座標の取得方法を変える
      const pageX = e.type.startsWith('touch') ? e.touches[0].pageX : e.pageX;
      const pageY = e.type.startsWith('touch') ? e.touches[0].pageY : e.pageY;
      
      startX = pageX;
      startY = pageY;
      
      // 現在のボタンの位置を取得（％ではなくpxで計算するため）
      initialLeft = btn.offsetLeft;
      initialTop = btn.offsetTop;
      
      // ふわふわアニメーションの現在位置を固定するため、位置をpx指定に上書き
      btn.style.left = initialLeft + 'px';
      btn.style.top = initialTop + 'px';
    }

    // 動いているとき
    function doDrag(e) {
      if (!isDragging) return;
      e.preventDefault(); // 画面全体のスクロールを防ぐ
      
      const pageX = e.type.startsWith('touch') ? e.touches[0].pageX : e.pageX;
      const pageY = e.type.startsWith('touch') ? e.touches[0].pageY : e.pageY;
      
      // 移動量を計算
      const deltaX = pageX - startX;
      const deltaY = pageY - startY;
      
      // 新しい位置を反映
      btn.style.left = (initialLeft + deltaX) + 'px';
      btn.style.top = (initialTop + deltaY) + 'px';
    }

    // 手を離したとき
    function endDrag() {
      if (!isDragging) return;
      // 少しでも動かしたら「ドラッグした」とみなす
      setTimeout(() => { isDragging = false; }, 50);
    }

    // マウスイベントの登録
    btn.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', doDrag);
    document.addEventListener('mouseup', endDrag);

    // タッチイベントの登録（スマホ対応）
    btn.addEventListener('touchstart', startDrag, { passive: false });
    document.addEventListener('touchmove', doDrag, { passive: false });
    document.addEventListener('touchend', endDrag);

    // 【重要】ドラッグしただけでリンクに飛んでしまうのを防ぐ対策
    btn.querySelector('a').addEventListener('click', (e) => {
      if (isDragging) {
        e.preventDefault(); // 移動させただけならリンクを開かない
      }
    });
  });
}

// 読み込み完了時に実行
window.addEventListener('DOMContentLoaded', setupDraggableButtons);
</script>
