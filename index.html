  <script>
    const heroSlides = document.querySelectorAll("[data-hero-slide]");
    const heroImages = [
      "images/topimg/1.PNG",
      "images/topimg/2.PNG",
      "images/topimg/3.PNG",
      "images/topimg/4.PNG",
      "images/topimg/5.PNG"
    ];

    if (heroSlides.length === 2 && heroImages.length > 1) {
      heroImages.forEach((src) => {
        const image = new Image();
        image.src = src;
      });

      let currentHeroImage = 0;
      let activeSlide = 0;

      setInterval(() => {
        const nextHeroImage = (currentHeroImage + 1) % heroImages.length;
        const nextHeroSrc = heroImages[nextHeroImage];
        const nextSlide = activeSlide === 0 ? 1 : 0;
        const incomingSlide = heroSlides[nextSlide];
        const outgoingSlide = heroSlides[activeSlide];

        const showNextSlide = () => {
          incomingSlide.classList.add("hero-img-active");
          outgoingSlide.classList.remove("hero-img-active");

          currentHeroImage = nextHeroImage;
          activeSlide = nextSlide;
        };

        incomingSlide.onload = showNextSlide;

        if (incomingSlide.getAttribute("src") === nextHeroSrc && incomingSlide.complete) {
          showNextSlide();
        } else {
          incomingSlide.src = nextHeroSrc;
        }
      }, 4500);
    }
  </script>
